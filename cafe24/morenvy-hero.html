  ▶ 붙여넣는 곳 : 모렌비 배너관리자 → 배너영역 "메인 배너 1"(영역ID 78b4)

  ▶ 디자인(폰트·레이아웃·고스트 텍스트·CSS)은 우리 스킨 그대로,
     영상/문구/링크만 관리자에서 코드 수정 없이 교체됩니다.
  ⚠ 브라우저 자동재생 정책상 영상은 "음소거(mute)" 상태여야 자동재생됩니다.
