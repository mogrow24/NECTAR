<!-- ===========================================================================
  NECTAR · STOCKIST — 기존 코드 그대로 + OFFLINE/ONLINE 토글 버튼만 목업 스타일
  적용: STOCKIST 페이지 Ctrl+A 삭제 → 붙여넣기 → 저장
  (stockist.css/js·모렌비·매장카드 전부 원본 유지. 맨 아래 토글 style만 추가)
============================================================================ -->
<!--@layout(/layout/basic/layout.html)-->
<!--@css(/mundane/css/sub_page/stockist.css)-->
<!--@js(/mundane/js/stockist.js)-->

<div id="stockist" class="header_layout_padding">

    <h2>STOCKIST</h2>

    <div class="stockist-head">
        <button type="button" class="is-active" data-stockist-target="offline">OFFLINE</button>
        <button type="button" data-stockist-target="online">ONLINE</button>
    </div>

    <div class="stockist-content">

        <div class="stockist-store offline">
            <div class="cover morenvy-banner-area" area_id="0643">
                <div class="app-box morenvy-banner">
                    <div class="image-Area">{#imgTag_1}</div>
                    <div class="text-Area">
                        <div class="sectionT">
                            <div class="title">{#title}</div>
                            <a href="{#link_1}" target="_blank">VIEW MAP</a>
                        </div>
                        <div class="sectionB">
                            <span>{#text_1}</span>
                            <span>{#text_2}</span>
                            <span>{#text_3}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="stockist-store online">
            <div class="cover morenvy-banner-area" area_id="6f89">
                <div class="app-box morenvy-banner">
                    <div class="image-Area">{#imgTag_1}</div>
                    <div class="text-Area">
                        <div class="sectionT">
                            <div class="title">{#title}</div>
                            <a href="{#link_1}" target="_blank">LINK</a>
                        </div>
                        <div class="sectionB">
                            <span>{#text_1}</span>
                            <span>{#text_2}</span>
                            <span>{#text_3}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>

<!-- OFFLINE/ONLINE 토글 버튼만 목업 스타일 (세그먼트형) -->
<style>
#stockist .stockist-head{ display:flex !important; justify-content:center; align-items:center; gap:0; margin:8px auto 40px; padding:0; border:0; }
#stockist .stockist-head button{ -webkit-appearance:none; appearance:none; min-width:150px; height:48px; padding:0 30px; margin:0;
  font-family:'Spectral',serif; font-size:13px; font-weight:500; letter-spacing:.2em; text-transform:uppercase;
  color:#1a1a3c; background:#fff; border:1px solid #1a1a3c; cursor:pointer; transition:color .2s, background .2s, border-color .2s; }
#stockist .stockist-head button + button{ border-left:0; }
#stockist .stockist-head button:hover{ color:#c7172a; }
#stockist .stockist-head button.is-active{ background:#c7172a; border-color:#c7172a; color:#fff; }
@media (max-width:980px){
  #stockist .stockist-head button{ min-width:0; flex:1 1 50%; max-width:200px; padding:0 12px; letter-spacing:.14em; }
}
</style>
